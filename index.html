<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>DNS-Resolver</title>

		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png"
		/>
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#f2f2f7" />
		<meta name="apple-mobile-web-app-title" content="DNS-Resolver" />

		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
		/>
		<link rel="stylesheet" href="/css/style.css" />
	</head>

	<body>
		<div class="container glass-panel">
			<div class="header-area">
				<h1 class="text-center">DNS-over-HTTPS</h1>
				<p class="subtitle text-center">Liquid Glass Edition</p>
			</div>

			<div class="card glass-card">
				<div class="card-header">DNS 查询设置</div>
				<div class="card-body">
					<form id="resolveForm">
						<div class="mb-3">
							<label for="dohSelect" class="form-label"
								>选择 DoH 地址</label
							>
							<select
								id="dohSelect"
								class="form-select glass-input"
							>
								<option
									value="current"
									selected
									id="currentDohOption"
								>
									自动 
								</option>
								<option value="https://cloudflare-dns.com/dns-query">
	                             https://cloudflare-dns.com/dns-query
                                </option>
                                <option value="https://dns.google/resolve">
	                             https://dns.google/resolve
                                </option>
                                <option value="https://dns.sb/dns-query">
	                            https://dns.sb/dns-query
                                </option>
								<option value="custom">自定义...</option>
							</select>
						</div>

						<div
							id="customDohContainer"
							class="mb-3"
							style="display: none"
						>
							<label for="customDoh" class="form-label"
								>输入自定义 DoH 地址</label
							>
							<input
								type="text"
								id="customDoh"
								class="form-control glass-input"
								placeholder="https://example.com/dns-query"
							/>
						</div>

						<div class="mb-4">
							<label for="domain" class="form-label"
								>待解析域名</label
							>
							<div class="input-group glass-input-group">
								<input
									type="text"
									id="domain"
									class="form-control glass-input"
									value="www.google.com"
									placeholder="输入域名，如 example.com"
								/>
								<button
									type="button"
									class="btn btn-glass-outline"
									id="clearBtn"
								>
									清除
								</button>
							</div>
						</div>

						<div class="d-flex gap-2">
							<button
								type="submit"
								class="btn btn-glass-primary flex-grow-1"
							>
								解析
							</button>
							<button
								type="button"
								class="btn btn-glass-secondary"
								id="getJsonBtn"
							>
								JSON
							</button>
							<button
								type="button"
								class="btn btn-glass-icon"
								id="themeToggle"
							>
								✨
							</button>
						</div>
					</form>
				</div>
			</div>

			<div class="card glass-card">
				<div
					class="card-header d-flex justify-content-between align-items-center"
				>
					<span>解析结果</span>
					<button
						class="btn btn-sm btn-glass-secondary"
						id="copyBtn"
						style="display: none"
					>
						复制结果
					</button>
				</div>
				<div class="card-body">
					<div id="loading" class="loading">
						<div class="loading-spinner"></div>
						<p class="loading-text">正在查询中...</p>
					</div>

					<div id="resultContainer" style="display: none">
						<div
							class="segmented-control mb-3"
							id="resultTabs"
							role="tablist"
						>
							<button
								class="segmented-item active"
								id="ipv4-tab"
								data-bs-toggle="tab"
								data-bs-target="#ipv4"
								type="button"
								role="tab"
							>
								V4
							</button>
							<button
								class="segmented-item"
								id="ipv6-tab"
								data-bs-toggle="tab"
								data-bs-target="#ipv6"
								type="button"
								role="tab"
							>
								V6
							</button>
							<button
								class="segmented-item"
								id="ns-tab"
								data-bs-toggle="tab"
								data-bs-target="#ns"
								type="button"
								role="tab"
							>
								NS
							</button>
							<button
								class="segmented-item"
								id="raw-tab"
								data-bs-toggle="tab"
								data-bs-target="#raw"
								type="button"
								role="tab"
							>
								JS
							</button>
						</div>

						<div
							class="tab-content glass-tab-content"
							id="resultTabContent"
						>
							<div
								class="tab-pane fade show active"
								id="ipv4"
								role="tabpanel"
							>
								<div
									class="result-summary"
									id="ipv4Summary"
								></div>
								<div id="ipv4Records"></div>
							</div>
							<div
								class="tab-pane fade"
								id="ipv6"
								role="tabpanel"
							>
								<div
									class="result-summary"
									id="ipv6Summary"
								></div>
								<div id="ipv6Records"></div>
							</div>
							<div class="tab-pane fade" id="ns" role="tabpanel">
								<div
									class="result-summary"
									id="nsSummary"
								></div>
								<div id="nsRecords"></div>
							</div>
							<div class="tab-pane fade" id="raw" role="tabpanel">
								<pre id="result" class="glass-pre">
等待查询...</pre
								>
							</div>
						</div>
					</div>

					<div id="errorContainer" style="display: none">
						<div class="glass-error">
							<pre id="errorMessage" class="error-message"></pre>
						</div>
					</div>
				</div>
			</div>

			<div class="beian-info glass-footer">
				<p>
					<strong>DNS-over-HTTPS</strong><br />
					<span id="dohUrlDisplay" class="copy-link" title="点击复制"
						>https://<span id="currentDomain">...</span>/<span
							id="currentDohPath"
							>dns-query</span
						></span
					>
				</p>
				<p class="small-text">
					上游 <span id="dohUpstream">one.one.one.one</span>
				</p>
			</div>
		</div>

		<!-- 由后端动态生成 window.DOH_CONFIG -->
		<script src="/js/config.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script src="/js/main.js"></script>
	</body>
</html>
